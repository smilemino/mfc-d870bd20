<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>주사위 두 개 — 화면을 누르면 굴러갑니다</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;user-select:none;cursor:pointer;
    background:radial-gradient(circle at 50% 30%,#1f2a44 0%,#0b1020 70%);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff}
  .hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);
    padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);
    backdrop-filter:blur(8px);font-size:14px;letter-spacing:.02em;opacity:.85;
    transition:opacity .4s ease;pointer-events:none}
  .hint.hide{opacity:0}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:48px;perspective:900px}
  .die{width:120px;height:120px;position:relative;transform-style:preserve-3d;
    transform:rotateX(-20deg) rotateY(25deg);transition:transform 0s}
  .die.rolling{animation:bounce 2s cubic-bezier(.18,.7,.2,1) both}
  .face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e6e8ef);
    border-radius:18px;box-shadow:inset 0 0 0 2px #d2d6e0,inset 0 -8px 18px rgba(0,0,0,.08);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:18px;gap:6px}
  .pip{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#444,#111);
    align-self:center;justify-self:center;visibility:hidden}
  .f1 .p5,.f2 .p1,.f2 .p9,.f3 .p1,.f3 .p5,.f3 .p9,
  .f4 .p1,.f4 .p3,.f4 .p7,.f4 .p9,.f5 .p1,.f5 .p3,.f5 .p5,.f5 .p7,.f5 .p9,
  .f6 .p1,.f6 .p3,.f6 .p4,.f6 .p6,.f6 .p7,.f6 .p9{visibility:visible}
  .face-1{transform:translateZ(60px)}
  .face-6{transform:rotateY(180deg) translateZ(60px)}
  .face-2{transform:rotateY(90deg) translateZ(60px)}
  .face-5{transform:rotateY(-90deg) translateZ(60px)}
  .face-3{transform:rotateX(90deg) translateZ(60px)}
  .face-4{transform:rotateX(-90deg) translateZ(60px)}
  .shadow{position:absolute;bottom:-44px;left:50%;width:140px;height:22px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(2px);
    transition:transform .2s ease,opacity .2s ease}
  .die.rolling .shadow{animation:shadow 2s cubic-bezier(.18,.7,.2,1) both}
  @keyframes bounce{
    0%{transform:translateY(0) rotateX(-20deg) rotateY(25deg)}
    15%{transform:translateY(-180px) rotateX(540deg) rotateY(720deg) rotateZ(180deg)}
    35%{transform:translateY(0) rotateX(900deg) rotateY(1080deg) rotateZ(360deg)}
    45%{transform:translateY(-70px) rotateX(1080deg) rotateY(1260deg) rotateZ(450deg)}
    60%{transform:translateY(0) rotateX(1260deg) rotateY(1440deg) rotateZ(540deg)}
    72%{transform:translateY(-25px) rotateX(1350deg) rotateY(1530deg) rotateZ(600deg)}
    82%{transform:translateY(0) rotateX(1410deg) rotateY(1590deg) rotateZ(640deg)}
    90%{transform:translate(4px,-6px) rotateX(1440deg) rotateY(1620deg) rotateZ(660deg)}
    95%{transform:translate(-3px,0) rotateX(1455deg) rotateY(1635deg) rotateZ(672deg)}
    100%{transform:translate(0,0) rotateX(1460deg) rotateY(1640deg) rotateZ(680deg)}
  }
  @keyframes shadow{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.7}
    15%{transform:translateX(-50%) scale(.45);opacity:.25}
    35%,60%,82%{transform:translateX(-50%) scale(1);opacity:.7}
    45%{transform:translateX(-50%) scale(.7);opacity:.4}
    72%{transform:translateX(-50%) scale(.85);opacity:.55}
  }
  @media(max-width:480px){.stage{gap:28px}.die{width:96px;height:96px}
    .face-1,.face-6,.face-2,.face-5,.face-3,.face-4{}
    .face{padding:14px;gap:4px}.pip{width:14px;height:14px}}
</style>
</head>
<body>
  <div class="hint" id="hint">화면 아무 곳이나 누르면 주사위가 굴러갑니다</div>
  <div class="stage">
    <div class="die" id="d1" data-final="1"></div>
    <div class="die" id="d2" data-final="1"></div>
  </div>
<script>
(function(){
  const FACE_ORIENT={
    1:'rotateX(0deg) rotateY(0deg)',
    2:'rotateY(-90deg)',
    3:'rotateX(-90deg)',
    4:'rotateX(90deg)',
    5:'rotateY(90deg)',
    6:'rotateY(180deg)'
  };
  function buildFace(n){
    const f=document.createElement('div');
    f.className='face f'+n+' face-'+n;
    for(let i=1;i<=9;i++){const p=document.createElement('div');p.className='pip p'+i;f.appendChild(p)}
    return f;
  }
  function buildDie(el){for(let n=1;n<=6;n++)el.appendChild(buildFace(n))}
  const d1=document.getElementById('d1'),d2=document.getElementById('d2');
  buildDie(d1);buildDie(d2);
  let rolling=false,ctx=null;
  function audio(){
    if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
    return ctx;
  }
  function clack(t){
    const a=audio();if(!a)return;
    const o=a.createOscillator(),g=a.createGain();
    o.type='square';o.frequency.setValueAtTime(180+Math.random()*120,a.currentTime+t);
    g.gain.setValueAtTime(.0001,a.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.08);
    o.connect(g);g.connect(a.destination);
    o.start(a.currentTime+t);o.stop(a.currentTime+t+.1);
  }
  function playSound(){[.0,.18,.42,.72,.95,1.25,1.55,1.78].forEach(clack)}
  function settle(el,value){
    el.style.transition='none';
    el.style.transform='rotateX(-20deg) rotateY(25deg) '+FACE_ORIENT[value];
    void el.offsetWidth;
    el.classList.remove('rolling');
  }
  function roll(){
    if(rolling)return;rolling=true;
    document.getElementById('hint').classList.add('hide');
    const v1=1+Math.floor(Math.random()*6),v2=1+Math.floor(Math.random()*6);
    [d1,d2].forEach(el=>{el.style.transition='none';el.classList.remove('rolling');void el.offsetWidth;el.classList.add('rolling')});
    playSound();
    setTimeout(()=>{settle(d1,v1);settle(d2,v2);rolling=false},2000);
  }
  function trigger(e){if(e.target.closest('a,button'))return;roll()}
  document.addEventListener('pointerdown',trigger);
  document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();roll()}});
  [d1,d2].forEach(el=>el.style.transform='rotateX(-20deg) rotateY(25deg) '+FACE_ORIENT[1]);
})();
</script>
</body>
</html>
